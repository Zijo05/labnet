[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "labnet"
version = "0.1.0"
description = "Build and operate simulated computer networks on one machine, using Incus containers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["networking", "lab", "incus", "containers", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
    "Topic :: Education",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The web UI is optional so that the CLI alone stays a one-dependency install.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
labnet = "labnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labnet = [
    "examples/*.yaml",
    "web/static/*",
    "web/static/vendor/*",
    "scenarios/*/*",
    "scenarios/*/setup/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a working Incus host; creates and deletes real containers",
]
# Unit tests only by default. Run integration tests with: pytest -m integration
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented way to declare a request body is a call in the default.
extend-immutable-calls = ["fastapi.Body"]
